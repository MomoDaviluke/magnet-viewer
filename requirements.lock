# 依赖精确锁定（与 requirements.txt 的宽松下限并存，二选一安装）
#
# 用途：发布/回归环境用 `pip install -r requirements.lock` 获得与
#       「已验证环境」逐字节一致的依赖树。libtorrent 2.0 与 2.1 的会话
#       配置 API 不兼容（2.1 移除 settings_pack），宽松约束下新装机器
#       可能落到未验证版本——这就是本文件存在的唯一理由（P2-24）。
#
# 生成方式（勿手改）：
#   python -m venv .venv && .venv\Scripts\pip install -r requirements.txt
#   （如需 moov/qt 两套流媒体测试：pip install imageio-ffmpeg）
#   .venv\Scripts\pip freeze > requirements.lock
# 升级依赖 = 改 requirements.txt → 重建 venv → 重新生成 lock → 15 套回归。
#
# 已验证环境：Python 3.13（3.13.12/3.13.14）+ libtorrent 2.1.1
#             + PySide6 6.11.2（Windows，2026-09-07 全量回归通过）
libtorrent==2.1.1
PySide6_Essentials==6.11.2
shiboken6==6.11.2

# 可选（仅 moov_stream_test / qt_stream_open_test 需要，start.bat 首启不装）：
#   pip install imageio-ffmpeg==0.6.0
