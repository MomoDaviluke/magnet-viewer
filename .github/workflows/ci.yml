name: Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # runner 系统 locale 为 cp1252，编不了脚本里的中文输出：
      # 不强制 UTF-8 时 print 直接 UnicodeEncodeError，进程秒崩且不产日志
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (locked, 与已验证环境一致)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock imageio-ffmpeg coverage==7.16.0

      - name: Run 27-suite regression
        run: python regression_run.py

      - name: Coverage gate (core+ui, fail-under=70)
        # 路线图 Phase 3.2 覆盖率门槛。基线 2026-10-10 实测 81%（branch 口径，
        # coverage_run.py full 全量 27 套），≥70% 故直接硬门禁、无过渡期。
        # 代价：全量套件再跑一遍（约 4~5 分钟），30 分钟超时内可承受；
        # 保留上方 regression 步骤是为了继续产 reg_*.log 调试工件。
        # 爬坡计划与最低覆盖模块见 CONTRIBUTING.md §二·覆盖率。
        run: |
          python coverage_run.py full
          python -m coverage report --fail-under=70

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        # 日志上传只是调试辅助，不参与验收：2026-09-09 Regression #6 出现
        # GitHub 对象存储 408 超时（服务端瞬时抖动）把全绿的 job 拖红，
        # 这里降级为"失败仅警告"，回归本身的失败仍会让 job 变红。
        continue-on-error: true
        with:
          name: regression-logs
          path: reg_*.log
          retention-days: 7
