name: Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # runner 系统 locale 为 cp1252，编不了脚本里的中文输出：
      # 不强制 UTF-8 时 print 直接 UnicodeEncodeError，进程秒崩且不产日志
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (locked, 与已验证环境一致)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock imageio-ffmpeg

      - name: Run 16-suite regression
        run: python regression_run.py

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        # 日志上传只是调试辅助，不参与验收：2026-09-09 Regression #6 出现
        # GitHub 对象存储 408 超时（服务端瞬时抖动）把全绿的 job 拖红，
        # 这里降级为"失败仅警告"，回归本身的失败仍会让 job 变红。
        continue-on-error: true
        with:
          name: regression-logs
          path: reg_*.log
          retention-days: 7
